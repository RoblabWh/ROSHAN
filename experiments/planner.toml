# The planner, imitating the rollout planner on the dynamic task (no PPO: updates = 0).
#   uv run python -m roshan.rl.train_planner experiments/planner.toml     -> runs/planner/
# Every setting is listed with the value this run uses. Copy the file to make a variant.

# what the trainer does; kind is "planner" or "fly"; "" means none
[run]
kind = "planner"
scenario = "scenarios/demo.npz"
envs = 512
updates = 0
seed = 0
teacher = "rollout"
imitation_steps = 4000
imitation_envs = 128
init = ""
critic_updates = 0

# network size
[net]
hidden = 128

# the simulation; names carry their units: _s seconds, _m metres, _l litres
[sim]
dt_s = 0.1
fire_every = 20
water_crit_l_m2 = 0.4
water_per_mw_grass_l_m2 = 0.35
water_per_mw_l_m2 = 0.6
water_per_mw_timber_l_m2 = 2.65
water_limit_kw_m = 4000.0
water_tau_s = 600.0
ember_s = 60.0
sheltered_waf = 0.2
ros_noise = 0.0
fire_model = "rothermel"

# the FireSPIN particle model, used when fire_model is firespin
[sim.spin]
dt_s = 0.5
emit_convective = true
emit_radiation = true
conv_y_st = 1.0
conv_y_lim = 0.2
conv_tau_mem_s = 10.0
conv_fl = 0.15
conv_c0 = 1.98
lt_m = 80.0
wind_a = 0.314
rad_y_st = 1.0
rad_y_lim = 0.165
generic_burn_s = 120.0
generic_ignite_s = 100.0

# the planner's task: drones are sent to fires
[allocate]
max_speed_ms = 10.0
tank_l = 40.0
drop_l = 40.0
drop_efficiency = 0.7
service_s = 60.0
pads = 8
endurance_s = 900.0
drones_per_station = 40
arrive_m = 5.0
station_m = 12.0
safe_m = 0.0
block_cells = 2
max_targets = 64
max_interval_s = 10.0
time_limit_s = 1800.0
random_ignitions = 2
random_wind = true
wind_scale = 1.0
preburn_s = 1800.0
preburn_cells = 20

# weight of each reward term
[reward]
drop = 0.0
refill = 0.0
burned = -100.0
fire_out = 1.0
timeout = 0.0

# PPO settings
[ppo]
lr = 0.0003
gamma_per_s = 0.999
lam = 0.95
clip = 0.2
epochs = 4
minibatches = 4
vf_coef = 0.5
ent_coef = 0.01
max_grad_norm = 0.5
rollout = 64
