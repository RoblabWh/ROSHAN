[package]
name = "roshan-py"
version.workspace = true
edition.workspace = true
description = "Python bindings for ROSHAN (module roshan._core)"

[lib]
name = "_core"
crate-type = ["cdylib"]

[features]
default = ["ui", "map"]
ui = ["dep:roshan-ui"]
map = ["ui", "roshan-ui/map"]

[dependencies]
roshan-core = { path = "../roshan-core" }
roshan-ui = { path = "../roshan-ui", optional = true }
# abi3: one wheel for every Python >= 3.11, no per-version rebuild
pyo3 = { workspace = true, features = ["abi3-py311"] }
numpy.workspace = true
serde_json = "1"
