[package]
name = "roshan-core"
version.workspace = true
edition.workspace = true
description = "ROSHAN2 simulation core: no Python, no UI, no file or network I/O"

[dependencies]
rayon.workspace = true
# libm: exp/pow/log identical on every platform, so results stay comparable across machines
libm = "0.2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
