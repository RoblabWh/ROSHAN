settings:
  # 0: GUI_RL, 2: NoGUI_RL, # Mode 1 is GUI and Mode 2 is NoGUI (ONLY Simulation)
  mode: 2
  # Random seed for reproducibility (-1 for random seed)
  seed: -1
  # RL_MODE: Either "train" or "eval"
  rl_mode: train
  # Eval-time action selection: false = deterministic argmax (act_certain), true = sample
  # from the policy distribution like training rollouts do. Planner-only (sub-agents stay
  # deterministic). Diagnostic knob to separate argmax-collapse from observation effects.
  eval_sampling: false
  # Resume training from a checkpoint
  # If set to true, the training will continue from the specified checkpoint
  resume: false
  # Whether to log evaluation results in tensorboard, plot their metrics and create the CSV files
  # Should generally be true during training or evaluation. 
  # If you only want to SEE what the agent does, set to false so your evaluation is not overridden
  log_eval: true
  # LLM support for the environment (currently not supported; was tested in very early prototypes)
  # Will probably break everything if set to true
  llm_support: false
  # Type of hierarchy to use for the agents (fly_agent, explore_agent, planner_agent)
  hierarchy_type: fly_agent
  # Uses this config as default and skips the GUI setup
  skip_gui_init: true
  # Enable PyTorch autograd anomaly detection (useful for debugging; slows down training)
  pytorch_detect_anomaly: false
  # Enable CIA mode (Covert Infiltration Avian) for government use only!
  cia_mode: false
  # Settings for automatic training of multiple runs under the same config
  auto_train:
    # Use or don't use automatic training
    use_auto_train: false
    # Number of total trainings, each containing max_train train_steps
    # automatically set to 1 when use_auto_train is false
    train_episodes: 10
    # Maximum number of train_steps(NOT policy steps) to perform
    # this setting is also used in case of NoGUI mode to determine when to stop training and switch to evaluation
    # This setting gets overridden in IQL settings and is calculated as the total number of offline_updates + online_updates
    max_train: 300 #12000 for TD3 ~ 8.5h
    # Maximum number of evaluations(one evaluation = one environment completed) to perform
    max_eval: 100
  optuna:
    use_optuna: false # Whether to use Optuna for hyperparameter optimization
    study_name: "fly_model_study_LR" # Name of the Optuna study
    study_root: "models" # Root directory to store the Optuna study and trials
    n_trials: 200 # Number of trials to perform
    n_startup_trials: 15 # Number of initial random trials before using the optimization algorithm
    n_warmup_steps: 200 # Number of warmup steps before starting the optimization
    use_pruning: true # Prune training episodes with MedianPruner
    objective: "objective" # Objective to optimize ("reward", "objective" or "time_to_end")
   # Whether to save the replay buffer when it's full (to model_directory/memory.pkl) 
   # This has only effect in evaluation mode
  save_replay_buffer: false
  # Size of the replay buffer to be saved when save_replay_buffer is true
  save_size: 2.0e+5
paths:
  # This is the root_path where your NEW trained models data is stored
  # Loading for your ROOT Model(chosen hierarchy) is ALSO done from here (Eval and Resuming Training)
  # Absolute or relative to the project root
  model_directory: models/CollisionFlyAgent2 #PPO_4A_NoManualDecay_P9Like
  # Leave this empty to get a default name from this config (best practice for training)
  # You can fast load models with suffixes ["latest", "best_reward", "best_obj"]
  # If you want to load a specific model, set the model_name to the name of the model file
  model_name: "latest"
  # Where THIS run writes (logs/, evaluation_stats.csv, tensorboard_logs/, config.yaml, networks/,
  # checkpoints). Empty = model_directory (in-place, the old behaviour). Set it for eval / baseline
  # arms so the trained model dir is never touched: model_directory is then load-from only.
  # Not supported together with skip_gui_init: false (GUI-chosen paths override it).
  run_dir: ""
  # Name of the CORINE dataset-file, Path to the Corine dataset file must be set in project_paths.json (generated default paths at compile time)
  corine_dataset_name: CLMS_CLCplus_RASTER_2021_010m_eu_03035_V1_1.tif
  # This map is used in NoGUI & skip_gui_init setup, if left empty("") the default map (uniform map) will be used.
  init_map: 35x36_Woods.tif #35x36_Woods.tif #81x129_Campsite.tif
#{'entropy_coeff': 1.230811218699769e-06, 'gamma': 0.9773972579784836, '_lambda': 0.9096741778233516, 'eps_clip': 0.22816431818213967}
algorithm:
  # Share the encoder(Inputspace in the network files) between the policy and value networks
  # This option should generally only be used for PPO, but can be used for other algorithms as well
  share_encoder: true
  # Use TanhNormal distribution for stochastic policy networks
  # If set to false, a normal distribution will be used and the actions will be clipped to the action space limits
  # Note: This leads to log_prob issues and suboptimal policies
  # TanhNormal is generally preferred as it naturally bounds the actions within the action space limits
  use_tanh_dist: true
  # JIT-compile actor/critic networks with torch.compile() for faster forward/backward passes
  # Opt in explicitly if you want it.
  use_torch_compile: false
  # Compilation mode: "default", "reduce-overhead", or "max-autotune".
  # "reduce-overhead" (CUDA graphs) currently BREAKS PPO training here; graph outputs get
  # overwritten between invocations (network_fly.py value head).
  # Use "default" (verified working). The planner is auto-forced to "default" in ppo.py anyway.
  compile_mode: "default"
  PPO:
    # Size of the Replay Buffer
    # Gets cleaned up after each training episode
    # Needs to be bigger when trying to safe the buffer
    memory_size: 1.0e+6
    # Learning rate for the optimizer #1.575e-4 for FlyAgent #1.0e-4 for PlannerAgent
    lr: 1.575e-4 #Top10: 2.965e-4 # Learning rate for the optimizer
    # Batch size for the optimizer
    batch_size: 500 #2000 #300 #2048
    # Number of steps to collect before updating the model
    horizon: 10000 #66000 #3600 #65536
    # Number of epochs to update the model
    k_epochs: 3
    # Coefficient for the entropy loss
    entropy_coeff: 0.0005
    # Multiplicative entropy_coeff decay per PPO update, floored at entropy_coeff_min.
    # 1.0 = off. Sharpens the late policy so argmax ≈ sampled by end of training.
    entropy_decay_rate: 1.0
    entropy_coeff_min: 0.0
    # Coefficient for the value loss (no effect if separate_optimizers is true)
    value_loss_coef: 0.5
    # Use separate optimizers for the policy and value networks
    # If this is set to false, a single optimizer will be used for
    # both networks (only works if share_encoder is false)
    separate_optimizers: false
    # Optimizer config — type + any kwargs accepted by that optimizer.
    # Available: Adam, AdamW, SGD, RMSprop, RAdam, Muon
    # Kwargs are signature-filtered per type: keys the chosen optimizer doesn't accept
    # are silently dropped (so betas is ignored by SGD, etc.).
    optimizer:
      type: AdamW
      # Adam-family momentum coefficients (running averages of grad and grad^2)
      betas: [0.9, 0.999]
      # Numerical stability term added to the denominator
      eps: 1.0e-5
      # L2 penalty (AdamW: decoupled weight decay). 0 = off
      weight_decay: 0
    # Scheduler config — type + any kwargs accepted by that scheduler (same signature
    # filtering as optimizer kwargs).
    # Available: CosineAnnealingLR, CosineAnnealingWarmRestarts, StepLR, ExponentialLR, ConstantLR, None
    scheduler:
      type: CosineAnnealingLR
      # Cosine half-period in scheduler steps; lr reaches eta_min after T_max steps
      T_max: 1000000
      # Lower bound the cosine decays to (torch default 0.0)
      eta_min: 0.0
    # Discount factor for the rewards
    gamma: 0.9635
    # Lambda for the Generalized Advantage Estimation (GAE)
    _lambda: 0.9
    # Clipping value for the PPO loss #0.2783
    eps_clip: 0.2
    # Manual decay of the log_std parameter in stochastic policies
    # If set to false, the log_std is learned by the network(state independent)
    manual_decay: false
    # Two types of manual decay implemented: train_step decay and logarithmic decay
    # train_step decay: reduces log_std based on the training step count using an exponential, causing a smooth nonlinear decay over time
    # logarithmic decay: applies the decay to the current log_std, producing a multiplicative, logarithmic reduction per update step
    # If you plan to use manual decay in combination with resuming training logarithmic decay is preferred
    use_logstep_decay: false
    # ~0.99975 for log_step_decay = true
    # ~0.985 for log_step_decay
    # Both values will lead to gradual decay towards zero over 200 episodes
    decay_rate: 0.9999 #0.99975
    # The approximate KL divergence that is calculated during training and
    # is used to monitor wheather the policy is changing too quickly
    # can be used to implement early stopping based on KL divergence
    # the early stopping will not stop the overall training, but only the current update step
    # If kl_early_stop is true, training will stop early if the kl divergence exceeds kl_target
    kl_early_stop: false
    # This value should ideally be set between 0.01 and 0.05
    kl_target: 0.2
    # Whether to use the first KL divergence estimate or the second (unbiased, lesser variance)
    # The second estimate is less harsh on the cutting, but might lead to larger policy updates
    # kl_1 = (old_logprobs - logprobs).mean()
    # kl_2 = ((ratios - 1) - log_ratio).mean()
    use_kl_1: true
  IQL:
    # Path to the replay buffer file (absolute or relative to the project root)
    # Size of the Replay Buffer is determined by the size used to create this buffer
    # Keep this in mind for Online Fine-Tuning
    buffer_path: "models/PPOCollisionBaseline_OptimizedReward_Top10Mean_Tanh/training_8/memory.pkl"
    # Learning rate for the optimizer
    lr: 1.575e-4
    # Batch size for the optimizer
    batch_size: 250
    # Discount factor for the rewards
    discount: 0.99
    # Expectile for the IQL loss
    expectile: 0.7
    # Target network soft update rate
    tau: 0.005
    # Temperature for the IQL loss
    temperature: 3.0
    # Frequency of policy updates in online finetuning
    # i.e. how many environment steps between the next policy update
    policy_freq: 50
    # Offline Training Steps (before eventually doing an online finetuning)
    # One offline update goes through the entire dataset once
    offline_updates: 10
    # Online Training Steps after offline training
    online_updates: 0
    # Number of epochs in online-finetuning, has no effect on offline training
    k_epochs: 1
    # Same semantics as algorithm.PPO.optimizer / .scheduler (see comments there)
    optimizer:
      type: Adam
      betas: [0.9, 0.999]
      eps: 1.0e-5
      weight_decay: 0
    scheduler:
      type: CosineAnnealingLR
      T_max: 1000000
  TD3:
    # Learning rate for the optimizer
    lr: 1.0e-4
    # Batch size for the optimizer
    batch_size: 512
    memory_size: 1.0e+6 # Max Size of the Replay Buffer
    min_memory_size: 512 # Minimum number of samples in the replay buffer before training starts
    k_epochs: 1 # Number of epochs to update the model
    discount: 0.99 # Discount factor for the rewards
    tau: 0.005 # Target network update rate
    exploration_noise: 0.15 # Exploration noise for the action space
    policy_noise: 0.2 # Noise added to the policy network
    noise_clip: 0.5 # Clipping value for the noise
    policy_freq: 2 # Frequency of policy updates
    # Same semantics as algorithm.PPO.optimizer / .scheduler (see comments there)
    optimizer:
      type: Adam
      betas: [0.9, 0.999]
      eps: 1.0e-5
      weight_decay: 0
    scheduler:
      type: CosineAnnealingLR
      T_max: 1000000

fire_model:
  # Rendering Parameters — purely cosmetic (GUI modes only), no effect on simulation or training
  rendering:
    # Draw the cell grid lines
    render_grid: false
    # Per-cell texture noise on terrain cells (visual variety for cell classes that support it)
    has_noise: true
    # Keep a lingering visual trace on cells after their state changes
    lingering: false
    # Intensity of the per-cell texture noise
    noise_level: 20
    # Pixel size of the noise pattern
    noise_size: 2
    # Window background color as RGBA
    background_color: [21, 19, 51, 255] #[41, 49, 51, 255]
  #### Simulation Parameters
  # These parameters are used to configure the simulation environment
  # They contain time, cell, particles, grid and wind parameters
  # The values are set to reasonable defaults for a simulation
  # Most of them can be adjusted in the GUI, adjustment here only for testing purposes
  simulation:
    time:
      # Simulation time step in seconds; all speeds/durations scale with it
      dt: 0.1 # 0.3
      # Bounds for dt when adjusted in the GUI
      min_dt: 0.0001
      max_dt: 5.0
    cells:
      # Besides flood_duration these values only affect the uniform grid, otherwise those values are derived from the cell_class
      cell_ignition_threshold: 100.0 # Time that the cell needs to be visited by a particle to be ignited in seconds (s)
      cell_burning_duration: 120.0 # Time the cell is capable of burning in seconds (s)
      cell_size: 10.0 # We assume quadratic cells and this is the length of both sides of the cell in meters (m)
      flood_duration: 5.0 # Flooding duration of a cell in seconds (s)
    particles:
      # These parameters are used to configure the particles in the simulation
      # Ranges are provided in the comments; stray apart from them, and you might get funny results
      emit_convective: true # Whether to emit convective particles
      virtualparticle_y_st: 1.0 # Hotness of the Particle (no real world unit yet) [0.0 - 1.0]
      virtualparticle_y_lim: 0.2 # How long the Particle is able to cause ignition (no real world unit yet) [0.1 - 0.3]
      virtualparticle_fl: 0.15 # Scaling factor for new position (need to calibrate) [0.0 - 10.0]
      virtualparticle_c0: 1.98 # A constant close to 2 [1.5 - 2.0]
      virtualparticle_tau_mem: 10.0 # A few tens of seconds [0.1 - 100.0]
      Lt: 80.0 # Height of emitting source (m)
      emit_radiation: true # Whether to emit radiation particles
      radiationparticle_y_st: 1.0 # Hotness of the Radiation Particle (no real world unit yet) [0.0 - 1.0]
      radiationparticle_y_lim: 0.165 # How long the Radiation Particle is able to cause ignition (no real world unit yet) [0.1 - 0.3]
    grid:
      uniform_nx: 50 # Number of cells in x-direction for uniform grid (Rows programmatically; Cols visually)
      uniform_ny: 50 # Number of cells in y-direction for uniform grid (Cols programmatically; Rows visually)
      exploration_map_size: 50 # Size of the exploration map side (side X side)
    wind:
      wind_uw: 10.0 # Wind Speed at 10m height in m/s [0 - 35(Hurricane)]
      wind_angle: -1.0 # Wind Angle in degree, -1 for random start wind angle
      wind_a: 0.314 # Component of the wind speed in the 1st direction [0.2 - 0.5]

# Environment Parameters
environment:
  # These parameters are used to configure the fire START behaviour in the environment
  # It does NOT affect the actual fire spread during simulation, this is handled by the fire_model
  fire_behaviour:
    # Fire ignition pattern: "cluster", "scattered", "ring", "random" (random picks one of the others each episode)
    fire_pattern: cluster
    # Percentage of cells that should be ignited at the start of the simulation [0.0 - 1.0]
    # Setting this to < 0.0 enables CURRICULUM mode: each episode samples fire_percentage
    # uniformly from [fire_percentage_min, fire_percentage_max] (a bounded difficulty
    # gradient) instead of using a fixed value.
    fire_percentage: 0.05
    # Curriculum bounds, used only when fire_percentage < 0.
    fire_percentage_min: 0.01
    fire_percentage_max: 0.05
    # How many clusters of fire should be started at the beginning of the simulation
    # Setting this to <= 0 will lead to single cells being ignited randomly according to fire_percentage
    num_fire_clusters: 2
    # This probability is used to determine if a fire spreads to a neighboring cell
    # It is only used to control starting Fire Clusters, not the actual fire spread during simulation
    # Setting this to < 0.0 will lead to random fire_noise between 0 and 1
    fire_spread_prob: 0.5
    # Noise ([-0.5, 0,5]*noise) for the fire spread probability, to introduce randomness in the fire spread
    # Setting this to < 0.0 will lead to random fire_noise between 0 and 1
    fire_noise: 1
  agent_behaviour:
    # Percentage of initial goal set (for fly_agents) that are at a fire_position
    fire_goal_percentage: 1
    # Percentage of initial starting positions that are at the groundstation
    groundstation_start_percentage: 1
    # Other parameters that are currently hard-coded or only accessible via GUI will be added here later
  agent:
    # If true, drones have a finite water tank and must recharge at the groundstation.
    # Applies to trained PlannerAgents and the heuristic_goals baseline alike.
    # Refuel is passive (fires whenever the drone is co-located with the groundstation and water < max).
    use_water_limit: false
    # Number of water units a drone can carry (one unit extinguishes one cell)
    water_capacity: 4
    # Time in seconds to recharge water at the groundstation (set this to 0 for instant recharge).
    # Full refill takes recharge_time / dt steps. With dt=0.1s and recharge_time=2.0, full refill = 20 steps,
    # roughly a one-way flight across a medium map — makes the trip a real opportunity cost.
    recharge_time: 2.0
    # If true (default, legacy behavior), planner sub-drones dispense water over ANY burning
    # cell they overfly on the way to their goal. If false, they dispense only at the assigned
    # goal cell, matching the standalone fly_agent branch.
    extinguish_en_route: true
    # EVRP-style water feasibility threshold (fraction of capacity, [0, 1]) for the PlannerAgent.
    # Below this, the pointer decoder masks all non-groundstation targets, forcing a refuel.
    # 0.0 disables. See config_planner.yaml for details. Only applied to planner_agent training.
    water_refuel_threshold: 0.0
    # Size of the drone in m (used for rendering and collision detection);
    # for convenience, all drones have the same size
    drone_size: 2
    fly_agent:
      # Whether the agent should avoid collisions with other agents
      # This changes the network input space and terminal conditions
      collision: true
      # Two types of policies can be learned:
      # Simple Policy: The episode ends when one agent reaches its goal_position
      # Complex Policy: The episode ends when all fires are extinguished (this influences the reward structure slightly)
      use_simple_policy: false
      # Two types of action space use:
      # If true, the agent's action represents accelerations (half times max_velocity^2)
      # If false, the agent's action represents an absolute velocity of the agent's max_velocity
      use_velocity_change: false
      # Discretizes the velocity into 100 bins per action dimension
      use_vel_bins: true
      # Determines the frequency of action selection (1 = every frame, 2 = every 2nd frame, etc.)
      frame_skips: 1 
      # Algorithm used by the fly_agent
      algorithm: PPO
      # Number of fly_agents
      num_agents: 4
      # Number of time steps to consider in the FlyAgent's memory
      time_steps: 3
      # Maximum speed of the FlyAgent in m/s
      max_speed: 10.0
      # View range of the FlyAgent in cells
      view_range: 10 
      rewards:
        # Reward for reaching the goal (depending on simple or complex policy)
        GoalReached: 0.8785929835412102 #Top10: 0.8785929835412102 #Default: 1.0
        # Penalty for going out of map bounds
        BoundaryTerminal: -4.328008565212994 #Top10: -4.328008565212994 #Default: -1.0
        # Reward for extinguishing a fire cell (only complex policy)
        Extinguish: 0.007235210886951731 #Top10: 0.007235210886951731 #Default: 0.01
        # Penalty for each time step to encourage faster completion
        TimeOut: -3.732236611159567 #Top10: -3.732236611159567 #Default: -1.0
        # Penalty for colliding with another agent
        Collision: -4.328008565212994 #Top10: -4.328008565212994 #Default: -1.0
        # Reward FACTOR for improving distance to the goal
        DistanceImprovement: 0.29559098335108996 #Top10: 0.29559098335108996 #Default: 0.1
        # Penalty FACTOR applied to the per-step INCREASE in closeness to other drones
        # (potential-based, one-sided). Multiplies a small per-step closeness delta, so it
        # is larger than the old absolute-proximity factor. Being near costs nothing; only
        # actively approaching does. #old Optuna(absolute): -0.11500008188778862
        ProximityPenalty: -1.0
        # Activation band for the proximity shaping, in view_range-normalized units
        # (0.4 ~= 4 cells at view_range=10). Closeness = sum of (thr - d) for neighbors
        # within this band; only its step-over-step increase is penalized.
        ProximityThreshold: 0.4
        # Penalty FACTOR for the per-step INCREASE in closeness to the nearest MAP EDGE
        # (potential-based, one-sided — same idea as ProximityPenalty but for the boundary).
        # Anticipatory: discourages moving toward the edge without penalising merely being near
        # it, so it fixes BoundaryExit failures WITHOUT the over-caution of BoundaryTerminal.
        # 0.0 => feature OFF (default; keeps existing models/configs unchanged).
        BoundaryProximityPenalty: 0.0
        # Activation band for the boundary shaping (view_range-normalized distance to the edge;
        # 0.3 ~= 1.5 cells at view_range=10). Only the step-over-step increase is penalized.
        BoundaryProximityThreshold: 0.3
    explore_agent:
      # Determines the frequency of action selection (1 = every frame, 2 = every 2nd frame, etc.)
      frame_skips: 1 
      # Algorithm used by the explore_agent (currently no training implemented, so set to no_algo)
      algorithm: no_algo 
      # Number of explore_agents
      num_agents: 3
      # Number of time steps to consider in the ExploreAgent's memory
      time_steps: 3
      # Maximum speed of the explore_agent in m/s
      # Should be set to the max_speed of the fly_agent uses
      max_speed: 20.0 
      # View range of the explore_agent in cells
      view_range: 20 
      # Default model path for the fly_agent (either absolute or relative to the project root)
      default_model_folder: "models/SimpleFlyAgent/"
      # You can fast load models with suffixes ["latest", "best_reward", "best_objective"]
      # If you want to load a specific model, set the model_name to the name of the model file
      default_model_name: best_obj
    planner_agent:
      # Hierarchy Timesteps (number of low-level steps per high-level step)
      hierarchy_timesteps: 60
      # Determines the frequency of action selection (1 = every frame, 2 = every 2nd frame, etc.)
      frame_skips: 1
      # ─── Event-driven replanning + SMDP credit assignment (planner-only) ──────────
      # When event_replan is true, the planner makes an off-schedule decision (instead of
      # only every hierarchy_timesteps steps) as soon as a drone frees up — it reaches its
      # goal or its assigned fire-cell stops burning — provided a burning fire exists that
      # no drone currently targets. Kills the "drone idles on an extinguished cell" waste.
      event_replan: false
      # Minimum number of low-level steps between planner decisions when event_replan fires.
      # Anti-thrash clamp; the fixed hierarchy_timesteps boundary is unaffected.
      min_replan_interval: 5
      # When smdp_gae is true, each planner PPO transition is discounted by gamma^k (k = env
      # steps that transition actually spanned) instead of gamma^1, so variable replanning
      # intervals get correct (SMDP/options) credit assignment. Python-only.
      smdp_gae: false
      # When true, normalize k by hierarchy_timesteps in the SMDP discount so a FIXED cadence
      # stays numerically ~= gamma^1 (used to isolate the discount change from the event
      # trigger in A/B experiments). Python-only.
      smdp_normalize_k: false
      # Eval-time fire source for the planner's OWN observations. false (default) = explored
      # fire_map only (fog / decentralized eval, current behavior); true = ground-truth
      # burning cells, exactly matching what the actor saw during training. Diagnostic knob
      # to separate the CTDE-fog effect from policy effects. Training is unaffected.
      eval_ground_truth_fires: false
      # Heuristic baseline (eval-only): replace the pointer network's goal assignment with
      # greedy nearest-pair matching (closest free-drone/fire pairs first; low-water and
      # left-over drones -> groundstation). Everything else — FlyAgent network, commitment
      # lock, event replans, water release — is identical to the learned planner.
      heuristic_goals: false
      # Assignment rule for that baseline (only used when heuristic_goals is true):
      # "greedy" = nearest free-drone/fire pairs first; "hungarian" = minimum-total-distance
      # matching (scipy linear_sum_assignment). Same preamble and fallbacks either way.
      heuristic_method: greedy
      # Lower clamp bound for the learned log_assignment_penalty in the pointer decoder.
      # -3.0 = legacy symmetric bound (penalty can decay to exp(-3) ~ 0.05). 0.0 floors the
      # duplicate penalty at exp(0) = 1 so PPO can strengthen but not erase it (counters
      # the GS free-riding drift where the policy erodes its own penalty).
      assignment_penalty_min: -3.0
      # Algorithm used by the planner_agent
      algorithm: PPO 
      # These parameters are used to configure the planner_agents LOW-LEVEL AGENTS
      num_agents: 5
      # Number of time steps to consider in the ExtinguishAgent's memory
      time_steps: 3
      # Maximum speed of the ExtinguishAgent (low-level-agent of the Planner) in m/s
      max_speed: 10.0 
      # View range of the ExtinguishAgent in cells
      view_range: 10 
      # Default model path for the fly_agent (either absolute or relative to the project root)
      default_model_folder: "models/SimpleFlyAgent/"
      # You can fast load models with suffixes ["latest", "best_reward", "best_objective"]
      # If you want to load a specific model, set the model_name to the name of the model file
      default_model_name: best_obj
      rewards:
        # Reward for reaching the goal (extinguishing all fires)
        GoalReached: 3.9105863581302542
        # Penalty for the Map being burned too much
        MapBurnedTooMuch: -2.1999479401238373
        # Per-step penalty per drone assigned to the groundstation while fires remain,
        # applied only when the drone's tank is above the water threshold below ("full-tank
        # parking tax"). 0.0 = off (legacy-neutral base default).
        FlyingTowardsGroundStation: 0.0
        # Water fraction above which the groundstation penalty fires. Below this, assigning
        # the groundstation is treated as a legitimate refuel (no penalty). 0.95 = only
        # near-full tanks are taxed (validated); 0.5 taxes any half-full drone (failed —
        # see FlyingTowardsGroundStation above).
        FlyingTowardsGroundStation_water_threshold: 0.5
        # Penalty for each time step to encourage faster completion
        TimeOut: -2.3843039593546047
        # Penalty FACTOR for selecting the same goal for multiple agents
        SameGoalPenalty: -1.552461776799054
        # Reward FACTOR for each fire cell extinguished from the low level agents during one high-level step
        ExtinguishFires: 0.6054212968617818
        # Reward FACTOR for fast extinguishing
        FastExtinguish: 0.21654104693212245
        # Reward FACTOR for drones getting closer to their assigned goals
        DistanceProgress: 0.1
        # Reward FACTOR per unit decrease in total burning cells per planner step
        # (positive delta = fire contained). Small — must augment ExtinguishFires, not dominate.
        SpreadPrevention: 0.05
        # Reward FACTOR per fractional tank refilled across all drones (outcome-based;
        # fires only when water actually increases, i.e. drone is at groundstation).
        # Sized to compete with ExtinguishFires (~0.6/cell): a full refuel of one drone
        # yields ~2.0 reward (≈3 extinguished cells), making refuel a strategically
        # profitable move rather than marginal. Gated on use_water_limit.
        WaterRefill: 2.0
        # Per-step penalty per drone sitting at empty tank while fires remain. Pushes
        # empty-tank from silent missing-reward into an active negative signal so PPO can
        # credit recharge as avoidance of this state. Gated on use_water_limit.
        EmptyTank: -0.05
        # Per-step penalty per drone with water=0 AND goal != groundstation. Targets the
        # planner's *assignment decision* rather than the empty state — additive with
        # EmptyTank, so a refueling-bound empty drone bleeds only the small EmptyTank
        # while a misrouted empty drone bleeds both. Sized so two planner steps of bad
        # assignment (~-1.0 total) is comparable to a SameGoalPenalty (-1.55) the planner
        # already learns to avoid. Gated on use_water_limit.
        FireGoalEmpty: -0.5
        # Per-drone-per-step bonus for keeping the same goal as the previous planner step.
        # Disabled (0.0) — commitment is now structurally enforced by PlannerAgent.apply_commitment
        # (planner_agent.py), which silently overrides locked drones' actions with the previous
        # goal until they arrive or the goal becomes invalid. Restoring a non-zero weight here
        # would double-shape what the lock already guarantees.
        GoalCommit: 0.0
        # ─── PBRS (Potential-Based Reward Shaping, Ng+ 1999) ─────────────────────────
        # When PbrsEnabled is true, the six dense terms above (ExtinguishFires,
        # SpreadPrevention, WaterRefill, EmptyTank, FireGoalEmpty, DistanceProgress) are
        # SKIPPED and replaced by a single F = γΦ(s')−Φ(s) signal where
        #   Φ(s) = wF·(-B/B_init) + wW·mean_water_frac + wD·(-mean_eligible_dist).
        # F is provably policy-invariant — the optimal policy is unchanged regardless of
        # weights. Terminal rewards (GoalReached, FastExtinguish, TimeOut, MapBurnedTooMuch)
        # and action-dependent terms (FlyingTowardsGroundStation, SameGoalPenalty,
        # GoalCommit) are unaffected. Defaults: off, so existing configs are unchanged.
        PbrsEnabled: false
        # Discount used inside the shaping. Must match the PPO γ to preserve invariance.
        PbrsGamma:   0.999
        # Φ_fire weight — primary task (suppress fires).
        PbrsWFire:   1.0
        # Φ_water weight — keep tanks non-empty so future suppression is feasible.
        PbrsWWater:  0.2
        # Φ_dist weight — purely heuristic shaping, useful early in training.
        PbrsWDist:   0.1