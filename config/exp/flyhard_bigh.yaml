# FlyHard Wave-5 scG "bigh": replicate the 98.5% CollisionFlyAgent TRAINING REGIME, which
# differs from base.yaml in three crucial ways the user flagged:
#   horizon 10000 -> 66000  (6.6x more env steps per PPO update => low-variance gradients)
#   batch_size 500 -> 2000  (4x larger minibatches)
#   entropy_coeff 0.0005 -> 0.01  (20x more exploration, sustained through training)
# These explain my small-horizon runs' noisy plateau (~84%) AND the KL collapse: tiny,
# high-variance updates. Big horizon is inherently stable, so NO kl guard needed (baseline
# ran kl_early_stop=false). Combined with my best-found shaping (moderate PBRS Prox -1.5/0.45,
# Coll -5.0, which cut collisions 31->6 on the current net). Scheduler left at base default
# (T_max 1e6 == ~constant lr, matching the baseline which used no scheduler). max_train 300
# like the baseline (300 updates x 66000 = 19.8M env steps).
# NOTE: the 98.5% baseline used num_agents=3; this run keeps the current target of 4 (harder).
# Compose: main.py config/agent/fly.yaml config/exp/flyhard_bigh.yaml \
#          paths.model_directory=models/FlyHard_scG settings.seed=8
settings:
  auto_train:
    max_train: 300
algorithm:
  PPO:
    horizon: 66000
    batch_size: 2000
    entropy_coeff: 0.01
    kl_early_stop: false
environment:
  agent:
    fly_agent:
      rewards:
        ProximityPenalty: -1.5
        ProximityThreshold: 0.45
        Collision: -5.0
