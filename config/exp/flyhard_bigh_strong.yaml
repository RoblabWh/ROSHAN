# FlyHard Wave-5 scG2 "bigh_strong": same big-horizon baseline regime as scG, but with
# STRONGER collision avoidance to drive 4-drone collisions toward zero (needed for 100%).
# At small horizon this shaping (Prox -2.0/0.5, Coll -7.0) CHOKED — the agent never learned
# the task (scB, best-obj 0.00). Hypothesis: that failure was the small horizon's unstable/
# data-starved learning, not the shaping per se. Big horizon (66000) gives stable, high-quality
# updates, so the agent should now be able to learn the task AND honor the strong avoidance.
# A/B vs scG (Prox -1.5) isolates whether stronger avoidance is learnable + helpful at big horizon.
# Compose: main.py config/agent/fly.yaml config/exp/flyhard_bigh_strong.yaml \
#          paths.model_directory=models/FlyHard_scG2 settings.seed=9
settings:
  auto_train:
    max_train: 300
algorithm:
  PPO:
    horizon: 66000
    batch_size: 2000
    entropy_coeff: 0.01
    kl_early_stop: false
environment:
  agent:
    fly_agent:
      rewards:
        ProximityPenalty: -2.0
        ProximityThreshold: 0.5
        Collision: -7.0
