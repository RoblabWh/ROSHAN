# FlyHard Wave-2 scD "stable_conservative": same moderate shaping + KL guard as scC, but
# also dampen the update magnitude (lower lr) and sharpen the late policy (lower entropy),
# in case the KL guard alone isn't enough to hold a high-objective policy. Tighter kl_target.
# Compose: main.py config/agent/fly.yaml config/exp/flyhard_sc_stable_conservative.yaml \
#          paths.model_directory=models/FlyHard_scD settings.seed=5
settings:
  auto_train:
    max_train: 800
algorithm:
  PPO:
    kl_early_stop: true
    kl_target: 0.05
    lr: 1.0e-4          # base 1.575e-4 -> smaller, steadier steps
    entropy_coeff: 0.0003   # base 0.0005 -> let log_std anneal for a crisper deterministic policy
environment:
  agent:
    fly_agent:
      rewards:
        ProximityPenalty: -1.5
        ProximityThreshold: 0.45
        Collision: -5.0
